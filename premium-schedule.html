<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤情報｜ゆるり水戸（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#22452f;--green-d:#17301f;--cream:#f6f1e7;--paper:#fffdf8;--ink:#26302a;--sub:#5c665e;--line:#ddd3bf;--accent:#c96f2e}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--cream);line-height:1.75;font-size:15px}
h1,h2,.mincho{font-family:"Shippori Mincho",serif}img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.demo-bar{background:var(--green-d);color:#e9e2d2;text-align:center;font-size:12px;padding:7px 12px}
header.site{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.96);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px;flex-wrap:wrap}
.logo{font-family:"Shippori Mincho",serif;font-size:21px;font-weight:700;color:var(--green);text-decoration:none;letter-spacing:.08em}
.logo small{display:block;font-size:10px;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--sub);letter-spacing:.22em}
section{padding:44px 0 60px}.sec-head{margin-bottom:22px}
.sec-head .en{font-size:12px;letter-spacing:.3em;color:var(--accent);font-weight:700}
.sec-head h2{font-size:clamp(21px,4vw,27px);color:var(--green);margin-top:4px}
.date-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.dtab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:13.5px}
.dtab.on{border-color:var(--green);background:var(--green);color:#fff}
.next-week{font-size:13px;color:var(--sub);margin:6px 0 18px}
.staff-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;font-family:"Shippori Mincho",serif;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0}
.badge.pop{background:var(--accent);color:#fff}.badge.rec{background:#fff;color:var(--green);border:1.5px solid var(--green)}.badge.new{background:var(--green);color:#fff}
.scard h3{font-size:16px}.scard .hours{font-size:13.5px;color:var(--sub)}
.scard .status{font-size:13px;font-weight:700;color:var(--green)}
footer.site{background:var(--green-d);color:#cfd6c6;padding:40px 0 60px}footer.site p{font-size:12.5px}
</style>
</head>
<body>
<div class="demo-bar">デモサイトです。店舗・スタッフ・出勤はすべて架空の設定です。実在の店舗・人物とは関係ありません。</div>
<header class="site"><div class="wrap header-in">
<a class="logo" href="lp-premium.html">ゆるり水戸<small>RELAXATION SALON YURURI MITO</small></a>
<a href="lp-premium.html" style="color:var(--green);font-weight:700;text-decoration:none;font-size:14px">← トップへ</a>
</div></header>

<section>
<div class="wrap">
<div class="sec-head"><p class="en">SCHEDULE</p><h2>出勤情報</h2></div>
<div class="date-tabs" id="dateTabs"></div>
<p class="next-week">次の週</p>
<div class="staff-cards" id="staffCards"></div>
<p style="font-size:13px;color:var(--sub);margin-top:22px">029-000-0000（架空）<br>OPEN：10:00～22:00<br>RECEPTION：9:30～21:00</p>
</div>
</section>

<footer class="site"><div class="wrap">
<p style="font-family:'Shippori Mincho',serif;color:#fff;font-size:18px;margin-bottom:8px">ゆるり水戸</p>
<p>このページは業態スキン（エステ版）のデモとして制作された架空店舗の出勤ページです。構成はゴールサイトの出勤ページに沿い、テキストと写真を差し替えています。実在の店舗・人物とは関係ありません。</p>
</div></footer>

<script>
(function(){
  var wd=["日","月","火","水","木","金","土"];
  var staff=[
    {name:"高橋 凛",age:28,ini:"凛",badge:["pop"],shift:[13,21],days:[1,2,3,4,5,6]},
    {name:"中村 咲",age:31,ini:"咲",badge:["rec"],shift:[10,18],days:[0,1,3,4,5]},
    {name:"渡辺 栞",age:26,ini:"栞",badge:["new","rec"],shift:[12,21],days:[2,3,4,5,6]},
    {name:"小野 遥",age:29,ini:"遥",badge:[],shift:[10,16],days:[1,2,4,6]},
    {name:"佐藤 葵",age:27,ini:"葵",badge:["rec"],shift:[15,21],days:[0,2,3,5,6]}
  ];
  var badgeText={pop:"人気",rec:"おすすめ",new:"新人"};
  var tabs=document.getElementById("dateTabs");
  var cards=document.getElementById("staffCards");
  var dates=[]; var today=new Date();
  for(var i=0;i<14;i++){ dates.push(new Date(today.getFullYear(),today.getMonth(),today.getDate()+i)); }
  var sel=dates[0];
  dates.forEach(function(d,i){
    var b=document.createElement("button"); b.type="button"; b.className="dtab"+(i===0?" on":"");
    b.textContent=(d.getMonth()+1)+"月"+("0"+d.getDate()).slice(-2)+"日("+wd[d.getDay()]+")";
    b.addEventListener("click",function(){ tabs.querySelectorAll(".dtab").forEach(function(x){x.classList.remove("on")}); b.classList.add("on"); sel=d; render(); });
    tabs.appendChild(b);
  });
  function badges(s){ return s.badge.map(function(x){ return '<span class="badge '+x+'">'+badgeText[x]+"</span>"; }).join(""); }
  function render(){
    cards.innerHTML="";
    staff.forEach(function(s){
      if(s.days.indexOf(sel.getDay())<0) return;
      var d=document.createElement("div"); d.className="scard";
      d.innerHTML='<div>'+badges(s)+'</div><div class="avatar">'+s.ini+'</div><h3>'+s.name+" ("+s.age+")</h3>"+'<p class="hours">'+s.shift[0]+":00～"+s.shift[1]+":00</p>"+'<p class="status">ご予約可能</p>';
      cards.appendChild(d);
    });
  }
  render();
})();
</script>
</body>
</html>
